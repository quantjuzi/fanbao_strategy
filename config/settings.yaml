# ============================================================
# 反包策略量化项目 - 全局配置
# ============================================================

# --- 数据路径 ---
data:
  csv_path: './data/全市场A股_20260412_20260612.csv'
  date_col: 'index'

# --- 策略参数 ---
strategy:
  mode1_fanbao:
    name: '反包策略'
    # 买入条件参数
    min_money: 10_000_000_000      # 最低成交额 10亿
    min_pct: 0.03                  # 最低涨幅 3%
    # 大单筛选
    large_order:
      enabled: true
      threshold: 500000            # 单笔>=50万算大单
      min_ratio: 1.0               # 主动买入/被动买入 > 1 才入选
    # API 参数（东方财富逐笔数据接口）
    api:
      url: 'https://push2.eastmoney.com/api/qt/stock/details/get'
      params:
        fields1: 'f1,f2,f3,f4'
        fields2: 'f51,f52,f53,f54,f55'
        pos: -1
        lmt: 5000
        ut: 'bd1d9ddb04089700cf9c27f6f7426281'
        fltt: 2
        invt: 2

  mode2_trend_gap:
    name: '高开趋势策略'
    min_money: 10_000_000_000      # 最低成交额 10亿
    min_pct: 0.02                  # 最低涨幅 2%

# --- 回测参数 ---
backtest:
  initial_cash: 50000              # 初始资金
  max_positions: 3                 # 最大同时持仓数
  commission_rate: 0.00025         # 手续费率（万2.5）
  slippage: 0.001                  # 滑点（0.1%）

# --- 日志 ---
logging:
  level: 'INFO'

# --- 数据管道参数 ---
data_pipeline:
   min_trading_days: 20          # 新股/次新股最少交易天数
   max_price_ratio: 0.5           # 单日最大涨跌幅容差(50%以上标记异常)
   st_detection:
     enabled: true
     method: "code_pattern"       # code_pattern / manual_list
     manual_codes: []             # 手动加入的ST股代码列表
   suspension:
     volume_threshold: 0          # 成交量低于此值视为停牌
     detect_by_price: true        # 同时用价格模式检测停牌
   limit_check:
     up_threshold: 0.99           # 收盘价>=涨停价*0.99视为涨停
     down_threshold: 1.01         # 收盘价<=跌停价*1.01视为跌停

